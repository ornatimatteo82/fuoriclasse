<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <!-- Sfondo app shell retro arcade -->
  <rect width="512" height="512" rx="104" fill="#101318"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#22303c" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="80" fill="#151b22"/>

  <!-- Texture pixel retro a griglia -->
  <g opacity="0.08" fill="#52a7a2">
    <rect x="40" y="40" width="32" height="32"/>
    <rect x="104" y="40" width="32" height="32"/>
    <rect x="168" y="40" width="32" height="32"/>
    <rect x="232" y="40" width="32" height="32"/>
    <rect x="296" y="40" width="32" height="32"/>
    <rect x="360" y="40" width="32" height="32"/>
    <rect x="424" y="40" width="32" height="32"/>
  </g>

  <!-- Scudo / Emblema centrale pixel-art -->
  <!-- Bordo dorato -->
  <rect x="120" y="96" width="272" height="260" rx="20" fill="#d7b83e"/>
  <rect x="136" y="112" width="240" height="228" rx="12" fill="#18363a"/>

  <!-- Lettera 'F' pixel-art (Fuoriclasse) -->
  <!-- Asta verticale -->
  <rect x="176" y="148" width="44" height="156" fill="#f4f7f2"/>
  <!-- Braccio superiore -->
  <rect x="176" y="148" width="144" height="36" fill="#f4f7f2"/>
  <!-- Braccio mediano -->
  <rect x="176" y="212" width="104" height="32" fill="#52a7a2"/>
  <!-- Accento dorato -->
  <rect x="320" y="148" width="24" height="36" fill="#f2d664"/>

  <!-- Stella d'oro arcade (campione) -->
  <g transform="translate(320, 260) scale(1.6)">
    <polygon points="16,2 20,11 30,12 22,19 25,29 16,23 7,29 10,19 2,12 12,11" fill="#f2d664" stroke="#8c6d1f" stroke-width="1.5"/>
  </g>

  <!-- Pallone da calcio 8-bit in basso -->
  <g transform="translate(206, 376)">
    <!-- Base pallone -->
    <circle cx="50" cy="50" r="44" fill="#f4f7f2" stroke="#222b35" stroke-width="8"/>
    <!-- Macchie pentagonali stilizzate -->
    <polygon points="50,26 68,39 61,60 39,60 32,39" fill="#151b22"/>
    <polygon points="50,14 58,6 42,6" fill="#151b22"/>
    <polygon points="86,40 94,36 94,48" fill="#151b22"/>
    <polygon points="76,76 86,84 76,88" fill="#151b22"/>
    <polygon points="24,76 14,84 24,88" fill="#151b22"/>
    <polygon points="14,40 6,36 6,48" fill="#151b22"/>
  </g>
</svg>
